<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" fill="#064e3b" />
  <circle cx="300" cy="400" r="260" fill="#059669" />
  <circle cx="300" cy="400" r="210" fill="#34d399" opacity="0.3" />
  
  <!-- Doctor Figure (Corporate Memphis Style) -->
  <g transform="translate(150, 180)">
    <!-- White Coat -->
    <path d="M50,280 C50,180 250,180 250,280 L290,520 L10,520 Z" fill="#ffffff" />
    <path d="M150,280 L150,520" stroke="#cbd5e1" stroke-width="4" />
    <path d="M110,280 L150,350 L190,280" fill="#10b981" />
    <!-- Stethoscope -->
    <path d="M125,280 C125,380 175,380 175,280" fill="none" stroke="#0f2f63" stroke-width="8" stroke-linecap="round" />
    <circle cx="175" cy="380" r="18" fill="#34d399" stroke="#ffffff" stroke-width="4" />
    <!-- Head -->
    <circle cx="150" cy="140" r="70" fill="#fcd34d" />
    <path d="M80,140 C80,70 220,70 220,140 C220,95 175,70 150,70 C125,70 80,95 80,140 Z" fill="#0f2f63" />
    <!-- Glasses -->
    <circle cx="125" cy="140" r="18" fill="none" stroke="#0f2f63" stroke-width="5" />
    <circle cx="175" cy="140" r="18" fill="none" stroke="#0f2f63" stroke-width="5" />
    <line x1="143" y1="140" x2="157" y2="140" stroke="#0f2f63" stroke-width="5" />
    <path d="M132,175 Q150,192 168,175" fill="none" stroke="#0f2f63" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
