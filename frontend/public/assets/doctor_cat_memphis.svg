<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="600" height="800" fill="#064e3b" />
  <circle cx="300" cy="400" r="260" fill="#059669" />
  <circle cx="300" cy="400" r="210" fill="#34d399" opacity="0.3" />

  <g transform="translate(100, 80)">
    <!-- Cat Ears -->
    <!-- Left Ear -->
    <polygon points="120,180 160,80 230,160" fill="#f97316" stroke="#c2410c" stroke-width="6" stroke-linejoin="round" />
    <polygon points="135,170 165,100 215,155" fill="#fecdd3" />
    <!-- Right Ear -->
    <polygon points="270,160 340,80 380,180" fill="#f97316" stroke="#c2410c" stroke-width="6" stroke-linejoin="round" />
    <polygon points="285,155 335,100 365,170" fill="#fecdd3" />

    <!-- Cat Head -->
    <ellipse cx="250" cy="240" rx="150" ry="120" fill="#fb923c" stroke="#c2410c" stroke-width="6" />

    <!-- Eye Patches / Fur Pattern -->
    <circle cx="180" cy="220" r="45" fill="#fed7aa" />
    <circle cx="320" cy="220" r="45" fill="#fed7aa" />

    <!-- Cute Eyes -->
    <circle cx="180" cy="220" r="24" fill="#0f2f63" />
    <circle cx="188" cy="212" r="8" fill="#ffffff" />
    
    <circle cx="320" cy="220" r="24" fill="#0f2f63" />
    <circle cx="328" cy="212" r="8" fill="#ffffff" />

    <!-- Nose & Mouth -->
    <polygon points="240,250 260,250 250,265" fill="#f43f5e" />
    <path d="M250,265 Q235,285 220,275 M250,265 Q265,285 280,275" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" />

    <!-- Whiskers -->
    <!-- Left Whiskers -->
    <line x1="120" y1="240" x2="40" y2="230" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <line x1="120" y1="260" x2="45" y2="265" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <!-- Right Whiskers -->
    <line x1="380" y1="240" x2="460" y2="230" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <line x1="380" y1="260" x2="455" y2="265" stroke="#78350f" stroke-width="5" stroke-linecap="round" />

    <!-- Body - Doctor's White Lab Coat -->
    <g transform="translate(0, 100)">
      <!-- Coat Base -->
      <path d="M100,240 C100,160 400,160 400,240 L440,540 L60,540 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />
      
      <!-- Inner Shirt & Tie -->
      <path d="M210,240 L250,330 L290,240" fill="#10b981" />
      <polygon points="242,280 258,280 262,350 250,370 238,350" fill="#0f2f63" />

      <!-- Coat Lapels & Pocket -->
      <path d="M100,240 L210,360 L210,540" fill="none" stroke="#cbd5e1" stroke-width="6" />
      <path d="M400,240 L290,360 L290,540" fill="none" stroke="#cbd5e1" stroke-width="6" />
      
      <!-- Pocket & Syringe/Pen -->
      <rect x="130" y="380" width="60" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
      <!-- Syringe in Pocket -->
      <rect x="150" y="340" width="12" height="50" rx="3" fill="#38bdf8" />
      <line x1="156" y1="320" x2="156" y2="340" stroke="#0f2f63" stroke-width="3" />

      <!-- Stethoscope Around Neck -->
      <path d="M170,220 C170,360 330,360 330,220" fill="none" stroke="#0f2f63" stroke-width="12" stroke-linecap="round" />
      <!-- Chest Piece -->
      <circle cx="330" cy="350" r="22" fill="#34d399" stroke="#ffffff" stroke-width="6" />
      <circle cx="330" cy="350" r="10" fill="#0f2f63" />

      <!-- Cute Paw Hands -->
      <ellipse cx="95" cy="420" rx="28" ry="35" fill="#fb923c" stroke="#c2410c" stroke-width="5" />
      <ellipse cx="405" cy="420" rx="28" ry="35" fill="#fb923c" stroke="#c2410c" stroke-width="5" />
    </g>
  </g>
</svg>
